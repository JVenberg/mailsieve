[project]
name = "mailsieve"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.59.1",
    "google-auth-oauthlib>=1.5.0",
    "gunicorn>=26.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
include = ["mailsieve/**/*.py", "tests/**/*.py"]
